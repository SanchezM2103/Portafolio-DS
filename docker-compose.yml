services:
  postgres:
    image: postgres:16-alpine
    container_name: portafolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portafolio_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - portafolio_postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  portafolio_postgres_data:
